      x-scope: MVP
      parameters:
        - { name: datasetId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/DqRuleStatus' } }
        - { name: dimension, in: query, schema: { $ref: '#/components/schemas/DqDimension' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DqRule' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Data Quality]
      operationId: createDqRule
