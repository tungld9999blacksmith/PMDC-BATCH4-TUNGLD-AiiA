              schema: { $ref: '#/components/schemas/MergeEvent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── Access ─────────────────────────
  /access-requests:
    get:
      tags: [Access]
      operationId: listAccessRequests
      summary: Yêu cầu của tôi (box=mine) hoặc chờ tôi duyệt (box=review, Steward)
      x-roles: [ANY]
      x-scope: MVP
      parameters:
        - { name: box, in: query, required: true, schema: { type: string, enum: [mine, review] } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AccessRequestStatus' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AccessRequest' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Access]
      operationId: createAccessRequest
      summary: Gửi yêu cầu truy cập có mục đích và thời hạn (US23)
      x-roles: [ANY]
      x-scope: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessRequestInput' }
            example:
              resourceType: PROFILE_FACET
              resourceId: FINANCE
              accessLevel: READ
              purpose: Rà soát sinh viên nợ học phí khoa CNTT để tư vấn hỗ trợ tài chính
              scope: { orgUnitCodes: [CNTT] }
              requestedDays: 90
      responses:
        '201':
          description: Đã gửi (PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequest' }
        '409':
          description: Đã có yêu cầu đang chờ hoặc quyền còn hiệu lực cho tài nguyên này
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /access-requests/{requestId}:
    delete:
      tags: [Access]
      operationId: cancelAccessRequest
      summary: Hủy yêu cầu đang chờ của tôi
      x-roles: [ANY]
      x-scope: MVP
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '204': { description: Đã hủy }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /access-requests/{requestId}/decision:
    post:
      tags: [Access]
      operationId: decideAccessRequest
      summary: Phê duyệt / từ chối (Steward phụ trách tài nguyên, không tự duyệt)
      x-roles: [DATA_STEWARD]
      x-scope: MVP
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                grantedDays: { type: integer, minimum: 1, maximum: 180, description: Có thể rút ngắn so với yêu cầu }
                note: { type: string, description: Bắt buộc khi REJECT }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /access-grants/{grantId}:
    delete:
      tags: [Access]
      operationId: revokeAccessGrant
      summary: Thu hồi quyền sớm
      x-roles: [DATA_STEWARD, PLATFORM_ADMIN]
      x-scope: MVP
      parameters:
        - { name: grantId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Đã thu hồi }
        '404': { $ref: '#/components/responses/NotFound' }

