      x-roles: [DATA_STEWARD]
      x-scope: MVP
      parameters: [{ $ref: '#/components/parameters/RuleId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DqRuleInput'
                - type: object
                  properties:
                    status: { $ref: '#/components/schemas/DqRuleStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DqRule' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Chưa chạy thử phiên bản hiện tại
