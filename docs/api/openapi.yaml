  # ───────────────────────── Semantic ─────────────────────────
  /semantic/query:
    post:
      tags: [Semantic]
      operationId: runSemanticQuery
      summary: Chạy truy vấn ngữ nghĩa cho widget, drill-down, builder (US27)
      description: |
        Semantic Service biên dịch `SemanticQuery` → SQL Trino và thực thi **dưới danh tính người gọi**.
        Trino + OPA áp row filter và column mask; ô có nhóm < 5 trả `suppressed: true` (BR12).
      x-roles: [ANY]
      x-scope: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SemanticQuery' }
            example:
              metrics: [academic_warning_rate]
              dimensions: [faculty, term]
              filters: [{ dimension: academic_year, op: eq, value: 2025-2026 }]
              orderBy: [{ field: term, direction: asc }]
              limit: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /semantic/metrics:
    get:
      tags: [Semantic]
      operationId: listMetrics
      summary: Danh sách metric (MVP dùng metric hệ thống; ADV cho phép tự định nghĩa)
