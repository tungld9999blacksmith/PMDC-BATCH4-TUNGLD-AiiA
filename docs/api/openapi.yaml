openapi: 3.0.4
info:
  title: AiiA Platform API
  version: 0.1.0
  description: |
    Hợp đồng HTTP giữa Web App (Angular) và Platform API (FastAPI) của **AiiA – Nền tảng Data Lakehouse hồ sơ 360°**.

    - **Xác thực:** OIDC qua SSO của trường (Keycloak). Mọi endpoint yêu cầu `Authorization: Bearer <access_token>`.
    - **Phân quyền:** `x-roles` liệt kê vai trò được gọi. Ngoài vai trò, truy vấn dữ liệu luôn áp phạm vi đơn vị (dòng),
      mức nhạy cảm (cột) và quyền dataset/dashboard còn hạn (BR08). Truy vấn dữ liệu chạy dưới danh tính người gọi (BR11).
    - **Phạm vi:** `x-scope: MVP | ADV` cho biết endpoint thuộc yêu cầu cơ bản hay nâng cao.
    - **Không rò rỉ sự tồn tại:** tài nguyên ngoài phạm vi trả `404`, giống tài nguyên không tồn tại (AC11).
    - **Lỗi:** RFC 7807 (`application/problem+json`).
    - **Audit:** mọi thao tác đọc dữ liệu cá nhân, export, thay đổi quyền/chính sách và câu hỏi gửi trợ lý đều được ghi audit (BR10).
  license:
    name: CC BY 4.0 (tài liệu)
    url: https://creativecommons.org/licenses/by/4.0/
servers:
  - url: http://localhost:8000/api/v1
    description: Docker Compose local
security:
  - bearerAuth: []
tags:
  - name: Me
    description: Phiên, quyền của tôi, trang chủ, thông báo
  - name: Profiles
    description: Hồ sơ 360° sinh viên, giảng viên, cán bộ
  - name: Sources
    description: Nguồn dữ liệu, upload, lịch, ánh xạ schema
  - name: Runs
    description: Lần chạy pipeline
  - name: Catalog
    description: Dataset, cột, xem trước, glossary
  - name: Data Quality
    description: Quy tắc, điểm chất lượng, issue
  - name: Identity
    description: Đối soát danh tính
  - name: Access
    description: Yêu cầu và cấp quyền truy cập
  - name: Dashboards
    description: Dashboard, chia sẻ, export
  - name: Semantic
    description: Truy vấn ngữ nghĩa, metric, dimension
  - name: Reports
    description: Báo cáo tự động (ADV)
  - name: Alerts
    description: Cảnh báo bất thường (ADV)
  - name: Lineage
    description: Lineage và phân tích tác động (ADV)
  - name: Assistant
    description: Trợ lý hỏi-đáp (ADV)
  - name: Admin
    description: Người dùng, chính sách, audit, chủ đề chặn

paths:
  # ───────────────────────── Me ─────────────────────────
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Thông tin người dùng hiện tại, vai trò và phạm vi (US03)
      x-roles: [ANY]
      x-scope: MVP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                id: 6f1c2a10-0000-4000-8000-000000000001
                email: lan.nt@uni.edu.vn
                fullName: Nguyễn Thị Lan
                orgUnit: { code: PDT, name: Phòng Đào tạo }
                roles: [{ role: REPORT_VIEWER, scopeOrgUnit: null }, { role: BI_ANALYST, scopeOrgUnit: null }]
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/grants:
    get:
      tags: [Me]
      operationId: listMyGrants
      summary: Quyền dữ liệu/dashboard đang hiệu lực (AC03)
      x-roles: [ANY]
      x-scope: MVP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AccessGrant' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/home:
    get:
      tags: [Me]
      operationId: getHomeSummary
      summary: Dữ liệu widget trang chủ theo vai trò (P02)
      x-roles: [ANY]
      x-scope: MVP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/logout:
    post:
      tags: [Me]
      operationId: logout
      summary: Thu hồi phiên hiện tại (US02)
      x-roles: [ANY]
      x-scope: MVP
      responses:
        '204': { description: Đã đăng xuất }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications:
    get:
      tags: [Me]
      operationId: listNotifications
      summary: Thông báo của tôi
      x-roles: [ANY]
      x-scope: MVP
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/{notificationId}/read:
    post:
      tags: [Me]
      operationId: markNotificationRead
      summary: Đánh dấu đã đọc
      x-roles: [ANY]
      x-scope: MVP
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Profiles ─────────────────────────
  /profiles:
    get:
      tags: [Profiles]
      operationId: searchProfiles
      summary: Tìm kiếm hồ sơ 360° trong phạm vi quyền (US11)
      x-roles: [REPORT_VIEWER, BI_ANALYST, DATA_STEWARD]
      x-scope: MVP
      parameters:
        - $ref: '#/components/parameters/Q'
        - { name: type, in: query, schema: { $ref: '#/components/schemas/SubjectType' } }
        - { name: orgUnit, in: query, schema: { type: string }, example: CNTT }
        - { name: cohort, in: query, schema: { type: string }, example: K66 }
        - { name: status, in: query, schema: { type: string }, example: STUDYING }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK — chỉ chứa hồ sơ trong phạm vi quyền
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ProfileSummary' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /profiles/{personId}:
    get:
      tags: [Profiles]
      operationId: getProfile
      summary: Header, KPI và danh sách facet của hồ sơ (US12–US14)
      description: 'Ghi audit `PROFILE_VIEW`. Trường không có quyền trả về dạng che (`masked: true`).'
      x-roles: [REPORT_VIEWER, BI_ANALYST, DATA_STEWARD]
      x-scope: MVP
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - { name: role, in: query, description: Vai trò cần xem khi một người có nhiều vai trò, schema: { $ref: '#/components/schemas/SubjectType' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile360' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{personId}/facets/{facet}:
    get:
      tags: [Profiles]
      operationId: getProfileFacet
      summary: Dữ liệu một tab hồ sơ (Học tập, Tài chính, Giảng dạy...)
      x-roles: [REPORT_VIEWER, BI_ANALYST, DATA_STEWARD]
      x-scope: MVP
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - { name: facet, in: path, required: true, schema: { $ref: '#/components/schemas/FacetCode' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacetData' }
        '403':
          description: Không có quyền xem facet — FE hiển thị khóa và nút yêu cầu quyền
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://aiia.local/problems/facet-locked
                title: Facet bị khóa
                status: 403
                detail: Bạn chưa có quyền xem tab Tài chính.
                requestable: { resourceType: PROFILE_FACET, resourceId: FINANCE }
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{personId}/timeline:
    get:
      tags: [Profiles]
      operationId: getProfileTimeline
      summary: Dòng thời gian sự kiện (US15) — chỉ sự kiện thuộc facet được phép
      x-roles: [REPORT_VIEWER, BI_ANALYST, DATA_STEWARD]
      x-scope: MVP
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - { name: eventType, in: query, schema: { type: array, items: { type: string } }, style: form, explode: false }
        - { name: source, in: query, schema: { type: array, items: { type: string } }, style: form, explode: false }
        - { name: before, in: query, description: Con trỏ phân trang (event_time), schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TimelineEvent' } }
                  nextBefore: { type: string, format: date-time, nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{personId}/attributes/{attribute}/provenance:
    get:
      tags: [Profiles]
      operationId: getAttributeProvenance
      summary: Nguồn gốc một thuộc tính (US16)
      x-roles: [REPORT_VIEWER, BI_ANALYST, DATA_STEWARD]
      x-scope: MVP
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - { name: attribute, in: path, required: true, schema: { type: string }, example: email }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttributeProvenance' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Sources ─────────────────────────
  /sources:
    get:
      tags: [Sources]
      operationId: listSources
      summary: Danh sách nguồn dữ liệu
      x-roles: [DATA_ENGINEER, DATA_STEWARD, PLATFORM_ADMIN]
      x-scope: MVP
      parameters:
        - $ref: '#/components/parameters/Q'
        - { name: type, in: query, schema: { $ref: '#/components/schemas/SourceType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SourceStatus' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/DataSource' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Sources]
      operationId: createSource
      summary: Đăng ký nguồn (US04) — tạo ở trạng thái DRAFT
      x-roles: [DATA_ENGINEER]
      x-scope: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataSourceInput' }
            example:
              code: SRC-FIN
              name: Tài chính – học phí
              type: FILE
              businessOwner: Phòng Kế hoạch – Tài chính
              purpose: Theo dõi tình trạng học phí phục vụ cảnh báo học vụ và hỗ trợ sinh viên
              legalBasisRef: QĐ 1234/QĐ-ĐH ngày 01/09/2026
              sensitivity: CONFIDENTIAL
              subjectTypes: [STUDENT]
              fileTemplate: { requiredColumns: [ma_sv, hoc_ky, so_tien_phai_nop, so_tien_da_nop] }
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /sources/{sourceId}:
    get:
      tags: [Sources]
      operationId: getSource
      summary: Chi tiết nguồn
      x-roles: [DATA_ENGINEER, DATA_STEWARD, PLATFORM_ADMIN]
      x-scope: MVP
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSource' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Sources]
      operationId: updateSource
      summary: Cập nhật nguồn, kích hoạt/tạm dừng (status)
      description: Chuyển sang `ACTIVE` yêu cầu đã kiểm tra kết nối thành công (AC04).
      x-roles: [DATA_ENGINEER]
      x-scope: MVP
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataSourcePatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSource' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /sources/{sourceId}/connection-test:
    post:
      tags: [Sources]
      operationId: testSourceConnection
      summary: Kiểm tra kết nối JDBC/API
      x-roles: [DATA_ENGINEER]
      x-scope: MVP
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                secret: { type: string, writeOnly: true, description: "Mật khẩu/token mới — được lưu vào secret store, không lưu DB" }
      responses:
        '200':
          description: Kết quả kiểm tra
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectionTestResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /sources/{sourceId}/uploads:
    post:
      tags: [Sources]
      operationId: uploadSourceFile
      summary: Upload CSV/XLSX, kiểm tra và xem trước (US05)
      description: Chưa ingest. Gọi `triggerRun` với `uploadId` để ingest.
      x-roles: [DATA_ENGINEER]
      x-scope: MVP
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: CSV hoặc XLSX ≤ 50 MB }
      responses:
        '201':
          description: Upload hợp lệ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File vượt 50 MB
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Sai định dạng hoặc header không khớp template
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://aiia.local/problems/header-mismatch
                title: Header không khớp template
                status: 422
                errors: [{ field: so_tien_da_nop, message: Thiếu cột bắt buộc }]
  /sources/{sourceId}/schedule:
    put:
      tags: [Sources]
      operationId: setSourceSchedule
      summary: Lập lịch ingest (US06)
      x-roles: [DATA_ENGINEER]
      x-scope: MVP
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Schedule' }
            example: { cron: '0 2 * * *', paused: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Schedule'
                  - type: object
                    properties:
                      nextRunAt: { type: string, format: date-time, nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /sources/{sourceId}/mappings:
    get:
      tags: [Sources]
      operationId: listMappings
      summary: Các phiên bản ánh xạ schema (US08)
      x-roles: [DATA_ENGINEER, DATA_STEWARD]
      x-scope: MVP
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SchemaMapping' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Sources]
      operationId: createMappingVersion
      summary: Lưu phiên bản mapping mới và kích hoạt
      x-roles: [DATA_ENGINEER]
      x-scope: MVP
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchemaMappingInput' }
      responses:
        '201':
          description: Đã tạo phiên bản mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchemaMapping' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /sources/{sourceId}/mappings/preview:
    post:
      tags: [Sources]
      operationId: previewMapping
      summary: Xem trước kết quả biến đổi theo mapping (AC08) và [ADV] danh sách ảnh hưởng (AC32)
      x-roles: [DATA_ENGINEER]
      x-scope: MVP
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchemaMappingInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MappingPreview' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /sources/{sourceId}/runs:
    post:
      tags: [Runs]
      operationId: triggerRun
      summary: Chạy ingest ngay (thủ công hoặc với file đã upload)
      x-roles: [DATA_ENGINEER]
      x-scope: MVP
      parameters: [{ $ref: '#/components/parameters/SourceId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                uploadId: { type: string, format: uuid }
                confirmDuplicate: { type: boolean, default: false, description: Bắt buộc true khi file trùng checksum (AC05) }
      responses:
        '202':
          description: Đã xếp hàng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineRun' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Nguồn không ACTIVE, đang có run chạy, hoặc file trùng chưa xác nhận
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ───────────────────────── Runs ─────────────────────────
  /runs:
    get:
      tags: [Runs]
      operationId: listRuns
      summary: Danh sách lần chạy (US07)
      x-roles: [DATA_ENGINEER, DATA_STEWARD, PLATFORM_ADMIN]
      x-scope: MVP
      parameters:
        - { name: sourceId, in: query, schema: { type: integer, format: int64 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RunStatus' } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/PipelineRun' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /runs/{runId}:
    get:
      tags: [Runs]
      operationId: getRun
      summary: Chi tiết lần chạy, các bước và kết quả DQ
      x-roles: [DATA_ENGINEER, DATA_STEWARD, PLATFORM_ADMIN]
      x-scope: MVP
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineRunDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /runs/{runId}/logs:
    get:
      tags: [Runs]
      operationId: streamRunLogs
      summary: Log lần chạy theo thời gian thực (SSE)
      x-roles: [DATA_ENGINEER, DATA_STEWARD, PLATFORM_ADMIN]
      x-scope: MVP
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: |
            Luồng `text/event-stream`. Sự kiện: `log` ({ts, level, step, message}), `status` (PipelineRun), `end`.
          content:
            text/event-stream:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /runs/{runId}/rerun:
    post:
      tags: [Runs]
      operationId: rerunRun
      summary: Chạy lại (idempotent — BR14) hoặc xử lý lại quarantine
