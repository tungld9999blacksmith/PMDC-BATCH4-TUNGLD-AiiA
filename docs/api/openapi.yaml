            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Conversation' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Assistant]
      operationId: createConversation
      summary: Tạo hội thoại mới (có thể gắn ngữ cảnh dashboard)
      x-roles: [REPORT_VIEWER, BI_ANALYST, DATA_STEWARD]
      x-scope: ADV
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dashboardId: { type: integer, format: int64, nullable: true }
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /assistant/conversations/{conversationId}:
    get:
      tags: [Assistant]
      operationId: getConversation
      summary: Hội thoại và các tin nhắn
      x-roles: [REPORT_VIEWER, BI_ANALYST, DATA_STEWARD]
      x-scope: ADV
      parameters: [{ $ref: '#/components/parameters/ConversationId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Conversation'
                  - type: object
                    properties:
                      messages: { type: array, items: { $ref: '#/components/schemas/AssistantMessage' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /assistant/conversations/{conversationId}/messages:
    post:
      tags: [Assistant]
      operationId: askAssistant
      summary: Hỏi trợ lý trên dữ liệu được cấp quyền (US39) — trả SSE
      description: |
        Luồng xử lý: kiểm tra chủ đề chặn → LLM đề xuất `SemanticQuery` chỉ trên metric `CERTIFIED` người hỏi có quyền
        → Semantic Service biên dịch → Trino thực thi dưới danh tính người hỏi → LLM diễn giải kết quả.
        LLM **không** sinh SQL trực tiếp và **không** nhận dữ liệu dòng chi tiết `RESTRICTED`.

        Sự kiện SSE:
        - `status` — `{stage: CHECKING | PLANNING | QUERYING | WRITING}`
        - `clarify` — `{question, options: [{label, patch}]}` khi câu hỏi mơ hồ
        - `token` — `{text}` văn bản câu trả lời theo luồng
        - `final` — `AssistantMessage` hoàn chỉnh (status ANSWERED | CLARIFYING | REFUSED | FAILED)
      x-roles: [REPORT_VIEWER, BI_ANALYST, DATA_STEWARD]
      x-scope: ADV
      parameters: [{ $ref: '#/components/parameters/ConversationId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AskRequest' }
            example: { message: "Tỉ lệ sinh viên bị cảnh báo học vụ của khoa CNTT theo học kỳ năm 2025?" }
      responses:
        '200':
          description: Luồng SSE
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event: status
                data: {"stage":"PLANNING"}

                event: token
                data: {"text":"Tỉ lệ cảnh báo học vụ khoa CNTT giảm từ 5,2% ..."}

                event: final
                data: {"id":981,"status":"ANSWERED","metricCodes":["academic_warning_rate"],"dataAsOf":"2026-10-30T06:00:00Z"}
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /assistant/messages/{messageId}/feedback:
    post:
      tags: [Assistant]
      operationId: rateAssistantMessage
      summary: Phản hồi hữu ích / không hữu ích
      x-roles: [REPORT_VIEWER, BI_ANALYST, DATA_STEWARD]
      x-scope: ADV
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, enum: [-1, 1] }
                comment: { type: string }
      responses:
        '204': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }

