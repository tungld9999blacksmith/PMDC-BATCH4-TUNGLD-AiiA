[project]
name = "aiia-pipelines"
version = "0.1.0"
description = "Pipeline Lakehouse của AiiA: dlt (landing), PyIceberg (bronze), Soda (DQ), dbt-trino (silver/gold), Dagster (điều phối)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster>=1.9,<2",
    "dagster-webserver>=1.9,<2",
    "dlt[s3,parquet]>=1.5,<2",
    "pyiceberg[sql-postgres,s3fs,pyarrow]>=0.8,<1",
    "pyarrow>=17,<30",
    "fsspec>=2024.6",
    "s3fs>=2024.6",
    "httpx>=0.27,<1",
    "dbt-core>=1.9,<2",
    "dbt-trino>=1.9,<2",
    "soda-core-trino>=3.3,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
