            schema: { $ref: '#/components/schemas/MetricInput' }
      responses:
        '201':
          description: Đã tạo (DRAFT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Metric' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
