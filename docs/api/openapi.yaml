      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MergeEvent' } }
        '404': { $ref: '#/components/responses/NotFound' }
