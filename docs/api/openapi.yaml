          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Thao tác gỡ PLATFORM_ADMIN cuối cùng
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /admin/org-units:
    get:
      tags: [Admin]
      operationId: listOrgUnits
      summary: Cây đơn vị
      x-roles: [ANY]
      x-scope: MVP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OrgUnit' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/policies:
    get:
      tags: [Admin]
      operationId: listPolicies
      summary: Chính sách phân quyền dòng/cột (US33)
      x-roles: [PLATFORM_ADMIN]
      x-scope: ADV
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Policy' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: createPolicy
      summary: Tạo chính sách (phiên bản 1)
      x-roles: [PLATFORM_ADMIN]
      x-scope: ADV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [name, datasetId, roleCode]
                  properties:
                    name: { type: string }
                    datasetId: { type: integer, format: int64 }
                    roleCode: { $ref: '#/components/schemas/RoleCode' }
                - $ref: '#/components/schemas/PolicyRules'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/policies/{policyId}/versions:
    get:
      tags: [Admin]
      operationId: listPolicyVersions
      summary: Lịch sử phiên bản chính sách
      x-roles: [PLATFORM_ADMIN]
      x-scope: ADV
      parameters: [{ $ref: '#/components/parameters/PolicyId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PolicyVersion' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Admin]
      operationId: createPolicyVersion
      summary: Lưu phiên bản mới (hoặc khôi phục bằng cách gửi lại nội dung phiên bản cũ) — BR19
      x-roles: [PLATFORM_ADMIN]
      x-scope: ADV
      parameters: [{ $ref: '#/components/parameters/PolicyId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PolicyRules'
                - type: object
                  properties:
                    changeNote: { type: string }
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/policies/simulate:
    post:
      tags: [Admin]
      operationId: simulatePolicy
      summary: Mô phỏng "Xem như người dùng X" trước khi lưu (AC33)
      x-roles: [PLATFORM_ADMIN]
      x-scope: ADV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [datasetId, asUserId]
                  properties:
                    datasetId: { type: integer, format: int64 }
                    asUserId: { type: string, format: uuid }
                - $ref: '#/components/schemas/PolicyRules'
      responses:
        '200':
          description: Dữ liệu mẫu sau khi áp chính sách (giá trị RESTRICTED luôn che)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TabularResult'
                  - type: object
                    properties:
                      visibleRowCount: { type: integer }
                      totalRowCount: { type: integer }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/audit-logs:
    get:
      tags: [Admin]
      operationId: listAuditLogs
      summary: Nhật ký kiểm toán chỉ đọc (US25)
      x-roles: [PLATFORM_ADMIN, DATA_STEWARD]
      x-scope: MVP
      parameters:
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string }, example: PROFILE_VIEW }
        - { name: objectType, in: query, schema: { type: string } }
        - { name: objectId, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string, enum: [ALLOW, DENY] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/assistant-logs:
    get:
      tags: [Admin]
      operationId: listAssistantLogs
      summary: Nhật ký hỏi-đáp (US40)
      x-roles: [PLATFORM_ADMIN]
      x-scope: ADV
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AssistantStatus' } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/AssistantMessage'
                            - type: object
                              properties:
                                question: { type: string }
                                user: { $ref: '#/components/schemas/UserRef' }
                                compiledSql: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/blocked-topics:
    get:
      tags: [Admin]
      operationId: listBlockedTopics
      summary: Chủ đề bị chặn
      x-roles: [PLATFORM_ADMIN]
      x-scope: ADV
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/BlockedTopic' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: createBlockedTopic
      summary: Thêm chủ đề bị chặn
      x-roles: [PLATFORM_ADMIN]
      x-scope: ADV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pattern]
              properties:
                pattern: { type: string }
                description: { type: string }
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockedTopic' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/blocked-topics/{topicId}:
    delete:
      tags: [Admin]
      operationId: deleteBlockedTopic
      summary: Xóa chủ đề bị chặn
      x-roles: [PLATFORM_ADMIN]
      x-scope: ADV
      parameters:
        - { name: topicId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Đã xóa }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token OIDC do Keycloak (SSO trường) cấp

  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Q: { name: q, in: query, description: Từ khóa (không phân biệt dấu), schema: { type: string } }
    PersonId: { name: personId, in: path, required: true, schema: { type: string, format: uuid } }
    SourceId: { name: sourceId, in: path, required: true, schema: { type: integer, format: int64 } }
    RunId: { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    DatasetId: { name: datasetId, in: path, required: true, schema: { type: integer, format: int64 } }
    RuleId: { name: ruleId, in: path, required: true, schema: { type: integer, format: int64 } }
    IssueId: { name: issueId, in: path, required: true, schema: { type: integer, format: int64 } }
    RequestId: { name: requestId, in: path, required: true, schema: { type: integer, format: int64 } }
    DashboardId: { name: dashboardId, in: path, required: true, schema: { type: integer, format: int64 } }
    MetricCode: { name: metricCode, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9_]*$' } }
    SubscriptionId: { name: subscriptionId, in: path, required: true, schema: { type: integer, format: int64 } }
    AlertId: { name: alertId, in: path, required: true, schema: { type: integer, format: int64 } }
    ConversationId: { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    PolicyId: { name: policyId, in: path, required: true, schema: { type: integer, format: int64 } }

  responses:
    BadRequest:
      description: Tham số không hợp lệ
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Chưa đăng nhập hoặc token hết hạn
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Vai trò không được phép thực hiện thao tác
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Không tìm thấy hoặc nằm ngoài phạm vi quyền (không phân biệt — AC11)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Xung đột trạng thái
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Dữ liệu vi phạm quy tắc nghiệp vụ
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Vượt giới hạn tần suất
      headers:
        Retry-After: { schema: { type: integer }, description: Số giây chờ }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ── Chung ──
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        requestable:
          type: object
          description: Có khi người dùng có thể gửi yêu cầu quyền cho tài nguyên bị chặn
          properties:
            resourceType: { $ref: '#/components/schemas/ResourceType' }
            resourceId: { type: string }
    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    UserRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
    OrgUnitRef:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
    Freshness:
      type: object
      properties:
        sources: { type: array, items: { type: string }, example: [SIS, LMS] }
        updatedAt: { type: string, format: date-time }
        stale: { type: boolean, description: Vượt SLA độ mới (BR15) }
        dqScore: { type: number, nullable: true }

    # ── Enum ──
    RoleCode: { type: string, enum: [PLATFORM_ADMIN, DATA_ENGINEER, DATA_STEWARD, BI_ANALYST, REPORT_VIEWER] }
    SubjectType: { type: string, enum: [STUDENT, LECTURER, STAFF] }
    Sensitivity: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED] }
    SourceType: { type: string, enum: [FILE, JDBC, API] }
    SourceStatus: { type: string, enum: [DRAFT, ACTIVE, PAUSED, ARCHIVED] }
    RunStatus: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, PARTIAL, FAILED] }
    DataLayer: { type: string, enum: [BRONZE, SILVER, GOLD, QUARANTINE] }
    DqDimension: { type: string, enum: [COMPLETENESS, UNIQUENESS, VALIDITY, CONSISTENCY, TIMELINESS] }
    DqRuleStatus: { type: string, enum: [DRAFT, ACTIVE, DISABLED] }
    DqIssueStatus: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, WONT_FIX] }
    MatchStatus: { type: string, enum: [PENDING, AUTO_MERGED, MERGED, REJECTED, UNMERGED] }
    ResourceType: { type: string, enum: [DATASET, DASHBOARD, PROFILE_FACET, METRIC] }
    AccessRequestStatus: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED, EXPIRED, REVOKED] }
    DashboardTopic: { type: string, enum: [TRAINING, HR, RESEARCH, FINANCE, DATA_QUALITY] }
    MetricStatus: { type: string, enum: [DRAFT, CERTIFIED, DEPRECATED] }
    DetectorKind: { type: string, enum: [VOLUME, FRESHNESS, METRIC_DRIFT] }
    AlertSeverity: { type: string, enum: [LOW, MEDIUM, HIGH] }
    AlertStatus: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED, DISMISSED] }
    LineageNodeType: { type: string, enum: [SOURCE, DATASET, COLUMN, METRIC, DASHBOARD] }
    AssistantStatus: { type: string, enum: [ANSWERED, CLARIFYING, REFUSED, FAILED] }
    FacetCode:
      type: string
      enum: [OVERVIEW, ACADEMIC, FINANCE, CONDUCT, ACTIVITY, OUTCOME, TEACHING, RESEARCH, EVALUATION, HR, DEVELOPMENT, RECOGNITION]

    # ── Me ──
    RoleAssignment:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/RoleCode' }
        scopeOrgUnit: { type: string, nullable: true, description: Mã đơn vị; null = toàn trường }
    Me:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        orgUnit: { $ref: '#/components/schemas/OrgUnitRef' }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } }
    HomeSummary:
      type: object
      properties:
        favoriteDashboards: { type: array, items: { $ref: '#/components/schemas/DashboardSummary' } }
        dataHealth:
          type: object
          properties:
            dqScore: { type: number }
            staleDatasets: { type: integer }
            openAlerts: { type: integer }
        failedRuns: { type: array, items: { $ref: '#/components/schemas/PipelineRun' } }
        openIssues: { type: integer }
        pendingMatches: { type: integer }
        pendingAccessReviews: { type: integer }
        recent:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [PROFILE, DASHBOARD, DATASET] }
              id: { type: string }
              title: { type: string }
              viewedAt: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, example: ACCESS_APPROVED }
        title: { type: string }
        link: { type: string, nullable: true }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    # ── Profiles ──
    ProfileSummary:
      type: object
      properties:
        personId: { type: string, format: uuid }
        fullName: { type: string }
        code: { type: string, description: Mã SV/mã CB }
        roles: { type: array, items: { $ref: '#/components/schemas/SubjectType' } }
        orgUnit: { $ref: '#/components/schemas/OrgUnitRef' }
        status: { type: string }
        completeness: { type: number, minimum: 0, maximum: 1 }
    MaskableValue:
      type: object
      description: Giá trị có thể bị che theo quyền
      properties:
        value: { description: Giá trị thật hoặc dạng che (VD `0********234`) }
        masked: { type: boolean }
        sensitivity: { $ref: '#/components/schemas/Sensitivity' }
        source: { type: string, nullable: true, example: SIS }
    Profile360:
      type: object
      properties:
        personId: { type: string, format: uuid }
        activeRole: { $ref: '#/components/schemas/SubjectType' }
        availableRoles: { type: array, items: { $ref: '#/components/schemas/SubjectType' } }
        header:
          type: object
          additionalProperties: { $ref: '#/components/schemas/MaskableValue' }
          example:
            fullName: { value: Nguyễn Văn A, masked: false, sensitivity: INTERNAL, source: SIS }
            nationalId: { value: 0********234, masked: true, sensitivity: RESTRICTED, source: SIS }
        kpis:
          type: array
          items:
            type: object
            properties:
              code: { type: string, example: gpa_cumulative }
              label: { type: string }
              value: { $ref: '#/components/schemas/MaskableValue' }
        facets:
          type: array
          items:
            type: object
            properties:
              code: { $ref: '#/components/schemas/FacetCode' }
              label: { type: string }
              allowed: { type: boolean }
              freshness: { $ref: '#/components/schemas/Freshness' }
    FacetData:
      type: object
      properties:
        facet: { $ref: '#/components/schemas/FacetCode' }
        freshness: { $ref: '#/components/schemas/Freshness' }
        fields:
          type: object
          additionalProperties: { $ref: '#/components/schemas/MaskableValue' }
        tables:
          type: array
          items:
            allOf:
              - type: object
                properties:
                  code: { type: string, example: enrollments }
                  title: { type: string }
              - $ref: '#/components/schemas/TabularResult'
        series:
          type: array
          items:
            type: object
            properties:
              code: { type: string, example: gpa_by_term }
              points:
                type: array
                items:
                  type: object
                  properties:
                    x: { type: string }
                    y: { type: number, nullable: true }
    TimelineEvent:
      type: object
      properties:
        eventId: { type: string }
        time: { type: string, format: date-time }
        type: { type: string, example: ENROLL }
        facet: { $ref: '#/components/schemas/FacetCode' }
        source: { type: string }
        title: { type: string }
    AttributeProvenance:
      type: object
      properties:
        attribute: { type: string }
        value: { $ref: '#/components/schemas/MaskableValue' }
        winningSource: { type: string }
        sourceUpdatedAt: { type: string, format: date-time }
        survivorshipRule: { type: string, example: 'Ưu tiên SIS cho thông tin học vụ' }
        candidates:
          type: array
          description: Chỉ trả khi người xem đủ quyền với mức nhạy cảm của thuộc tính
          items:
            type: object
            properties:
              source: { type: string }
              value: {}
              updatedAt: { type: string, format: date-time }

    # ── Sources & runs ──
    DataSourceInput:
      type: object
      required: [code, name, type, businessOwner, purpose, legalBasisRef, sensitivity, subjectTypes]
      properties:
        code: { type: string, pattern: '^SRC-[A-Z0-9]{2,20}$' }
        name: { type: string }
        type: { $ref: '#/components/schemas/SourceType' }
        businessOwner: { type: string }
        purpose: { type: string, minLength: 10 }
        legalBasisRef: { type: string, minLength: 3 }
        legalDocUri: { type: string, format: uri }
        sensitivity: { $ref: '#/components/schemas/Sensitivity' }
        subjectTypes: { type: array, minItems: 1, items: { $ref: '#/components/schemas/SubjectType' } }
        connectionConfig: { type: object, additionalProperties: true, description: Không chứa bí mật }
        fileTemplate:
          type: object
          properties:
            requiredColumns: { type: array, items: { type: string } }
    DataSourcePatch:
      type: object
      properties:
        name: { type: string }
        businessOwner: { type: string }
        purpose: { type: string, minLength: 10 }
        legalBasisRef: { type: string }
        sensitivity: { $ref: '#/components/schemas/Sensitivity' }
        connectionConfig: { type: object, additionalProperties: true }
        fileTemplate: { type: object, additionalProperties: true }
        status: { $ref: '#/components/schemas/SourceStatus' }
    DataSource:
      allOf:
        - $ref: '#/components/schemas/DataSourceInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            status: { $ref: '#/components/schemas/SourceStatus' }
            owner: { $ref: '#/components/schemas/UserRef' }
            hasSecret: { type: boolean }
            schedule: { $ref: '#/components/schemas/Schedule' }
            lastRun: { $ref: '#/components/schemas/PipelineRun' }
    ConnectionTestResult:
      type: object
      properties:
        ok: { type: boolean }
        latencyMs: { type: integer }
        message: { type: string }
        discoveredTables: { type: array, items: { type: string } }
    UploadResult:
      type: object
      properties:
        uploadId: { type: string, format: uuid }
        fileName: { type: string }
        rowCount: { type: integer }
        checksumSha256: { type: string }
        duplicateOfBatchId: { type: integer, format: int64, nullable: true, description: Có giá trị khi file trùng checksum (AC05) }
        preview: { $ref: '#/components/schemas/TabularResult' }
    Schedule:
      type: object
      required: [cron]
      properties:
        cron: { type: string, example: '0 2 * * *' }
        paused: { type: boolean, default: false }
    MappingRule:
      type: object
      required: [targetColumn]
      properties:
        sourceColumn: { type: string, nullable: true }
        targetColumn: { type: string }
        transform: { type: string, nullable: true, example: "to_date(ngay_sinh, 'dd/MM/yyyy')" }
    SchemaMappingInput:
      type: object
      required: [targetDatasetId, rules]
      properties:
        targetDatasetId: { type: integer, format: int64 }
        rules: { type: array, items: { $ref: '#/components/schemas/MappingRule' } }
    SchemaMapping:
      allOf:
        - $ref: '#/components/schemas/SchemaMappingInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            version: { type: integer }
            active: { type: boolean }
            createdBy: { $ref: '#/components/schemas/UserRef' }
            createdAt: { type: string, format: date-time }
    MappingPreview:
      type: object
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items:
            type: object
            properties:
              targetColumn: { type: string }
              message: { type: string, example: Thiếu ánh xạ cho trường bắt buộc }
        preview: { $ref: '#/components/schemas/TabularResult' }
        impacted: { type: array, items: { $ref: '#/components/schemas/LineageNode' }, description: '[ADV] Thành phần phía sau bị ảnh hưởng' }
    PipelineRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: integer, format: int64 }
        sourceCode: { type: string }
        trigger: { type: string, enum: [MANUAL, SCHEDULE, RERUN, REPROCESS] }
        status: { $ref: '#/components/schemas/RunStatus' }
        rowsRead: { type: integer }
        rowsWritten: { type: integer }
        rowsQuarantined: { type: integer }
        queuedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    PipelineRunDetail:
      allOf:
        - $ref: '#/components/schemas/PipelineRun'
        - type: object
          properties:
            steps:
              type: array
              items:
                type: object
                properties:
                  name: { type: string, enum: [BRONZE, DQ, SILVER, GOLD] }
                  status: { $ref: '#/components/schemas/RunStatus' }
                  startedAt: { type: string, format: date-time }
                  finishedAt: { type: string, format: date-time }
            dqResults:
              type: array
              items:
                type: object
                properties:
                  ruleId: { type: integer, format: int64 }
                  description: { type: string }
                  severity: { type: string, enum: [BLOCKING, WARNING] }
                  evaluated: { type: integer }
                  failed: { type: integer }
                  status: { type: string, enum: [PASS, FAIL, ERROR] }
            errorMessage: { type: string, nullable: true }

    # ── Catalog ──
    Dataset:
      type: object
      properties:
        id: { type: integer, format: int64 }
        layer: { $ref: '#/components/schemas/DataLayer' }
        schemaName: { type: string }
        tableName: { type: string }
        displayName: { type: string }
        description: { type: string }
        owner: { $ref: '#/components/schemas/UserRef' }
        steward: { $ref: '#/components/schemas/UserRef' }
        tags: { type: array, items: { type: string } }
        freshness: { $ref: '#/components/schemas/Freshness' }
        accessible: { type: boolean, description: Người gọi đã có quyền đọc dữ liệu }
    DatasetColumn:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        dataType: { type: string }
        description: { type: string }
        sensitivity: { $ref: '#/components/schemas/Sensitivity' }
        glossaryTerm: { $ref: '#/components/schemas/GlossaryTerm' }
    DatasetDetail:
      allOf:
        - $ref: '#/components/schemas/Dataset'
        - type: object
          properties:
            columns: { type: array, items: { $ref: '#/components/schemas/DatasetColumn' } }
            rowCount: { type: integer, format: int64 }
            freshnessSlaMinutes: { type: integer }
            usedBy:
              type: object
              properties:
                dashboards: { type: array, items: { $ref: '#/components/schemas/DashboardSummary' } }
                metrics: { type: array, items: { type: string } }
    TabularResult:
      type: object
      properties:
        columns:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string }
              masked: { type: boolean }
        rows: { type: array, items: { type: array, items: {} } }
    GlossaryTermInput:
      type: object
      required: [name, definition]
      properties:
        name: { type: string }
        definition: { type: string }
    GlossaryTerm:
      allOf:
        - $ref: '#/components/schemas/GlossaryTermInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            owner: { $ref: '#/components/schemas/UserRef' }

    # ── Data quality ──
    DqRuleInput:
      type: object
      required: [datasetId, ruleType, dimension, severity, description]
      properties:
        datasetId: { type: integer, format: int64 }
        columnId: { type: integer, format: int64, nullable: true }
        ruleType: { type: string, enum: [NOT_NULL, UNIQUE, RANGE, REGEX, REFERENCE, FRESHNESS, CUSTOM_SQL] }
        dimension: { $ref: '#/components/schemas/DqDimension' }
        severity: { type: string, enum: [BLOCKING, WARNING] }
        params: { type: object, additionalProperties: true }
        description: { type: string }
    DqRule:
      allOf:
        - $ref: '#/components/schemas/DqRuleInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            status: { $ref: '#/components/schemas/DqRuleStatus' }
            version: { type: integer }
            lastPassRate: { type: number, nullable: true }
            lastDryRunVersion: { type: integer, nullable: true }
    DryRunResult:
      type: object
      properties:
        evaluated: { type: integer }
        failed: { type: integer }
        sample: { $ref: '#/components/schemas/TabularResult' }
    DqScoreBoard:
      type: object
      properties:
        overall: { type: number }
        byDimension:
          type: object
          additionalProperties: { type: number }
          example: { COMPLETENESS: 98.2, UNIQUENESS: 99.9, VALIDITY: 96.4, CONSISTENCY: 97.0, TIMELINESS: 92.5 }
        rows:
          type: array
          items:
            type: object
            properties:
              key: { type: string, description: Dataset hoặc nguồn }
              score: { type: number }
              byDimension: { type: object, additionalProperties: { type: number } }
        trend:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              score: { type: number }
    DqIssue:
      type: object
      properties:
        id: { type: integer, format: int64 }
        rule: { $ref: '#/components/schemas/DqRule' }
        datasetId: { type: integer, format: int64 }
        affectedRows: { type: integer, format: int64 }
        severity: { type: string, enum: [BLOCKING, WARNING] }
        status: { $ref: '#/components/schemas/DqIssueStatus' }
        assignee: { $ref: '#/components/schemas/UserRef' }
        lastRunId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        comments: { type: array, items: { $ref: '#/components/schemas/Comment' } }
    Comment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        author: { $ref: '#/components/schemas/UserRef' }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    # ── Identity ──
    MatchRecord:
      type: object
      properties:
        sourceCode: { type: string }
        sourceKey: { type: string }
        personId: { type: string, format: uuid }
        fields: { type: object, additionalProperties: { $ref: '#/components/schemas/MaskableValue' } }
    MatchCandidate:
      type: object
      properties:
        id: { type: integer, format: int64 }
        score: { type: number }
        status: { $ref: '#/components/schemas/MatchStatus' }
        left: { $ref: '#/components/schemas/MatchRecord' }
        right: { $ref: '#/components/schemas/MatchRecord' }
        comparison:
          type: object
          description: Kết quả so khớp từng trường
          additionalProperties: { type: string, enum: [MATCH, PARTIAL, DIFFERENT, MISSING] }
        createdAt: { type: string, format: date-time }
    MergeEvent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        action: { type: string, enum: [MERGE, UNMERGE] }
        survivorPersonId: { type: string, format: uuid }
        mergedPersonId: { type: string, format: uuid }
        actor: { $ref: '#/components/schemas/UserRef' }
        automatic: { type: boolean }
        createdAt: { type: string, format: date-time }

    # ── Access ──
    AccessRequestInput:
      type: object
      required: [resourceType, resourceId, purpose, requestedDays]
      properties:
        resourceType: { $ref: '#/components/schemas/ResourceType' }
        resourceId: { type: string }
        accessLevel: { type: string, enum: [READ, EXPORT], default: READ }
        purpose: { type: string, minLength: 10 }
        scope: { type: object, additionalProperties: true }
        requestedDays: { type: integer, minimum: 1, maximum: 180 }
    AccessRequest:
      allOf:
        - $ref: '#/components/schemas/AccessRequestInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            resourceName: { type: string }
            requester: { $ref: '#/components/schemas/UserRef' }
            status: { $ref: '#/components/schemas/AccessRequestStatus' }
            reviewer: { $ref: '#/components/schemas/UserRef' }
            reviewNote: { type: string, nullable: true }
            createdAt: { type: string, format: date-time }
            decidedAt: { type: string, format: date-time, nullable: true }
            expiresAt: { type: string, format: date-time, nullable: true }
    AccessGrant:
      type: object
      properties:
        id: { type: integer, format: int64 }
        resourceType: { $ref: '#/components/schemas/ResourceType' }
        resourceId: { type: string }
        resourceName: { type: string }
        accessLevel: { type: string, enum: [READ, EXPORT] }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        grantedBy: { $ref: '#/components/schemas/UserRef' }

    # ── Dashboards & semantic ──
    Filter:
      type: object
      required: [dimension, op]
      properties:
        dimension: { type: string }
        op: { type: string, enum: [eq, neq, in, between, gte, lte] }
        value: {}
        values: { type: array, items: {} }
    FilterList:
      type: array
      items: { $ref: '#/components/schemas/Filter' }
    SemanticQuery:
      type: object
      required: [metrics]
      properties:
        metrics: { type: array, minItems: 1, items: { type: string } }
        dimensions: { type: array, items: { type: string } }
        filters: { $ref: '#/components/schemas/FilterList' }
        orderBy:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              direction: { type: string, enum: [asc, desc] }
        limit: { type: integer, minimum: 1, maximum: 5000, default: 500 }
    QueryResult:
      type: object
      properties:
        columns:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              kind: { type: string, enum: [DIMENSION, METRIC] }
              unit: { type: string, nullable: true }
        rows:
          type: array
          items:
            type: array
            items:
              description: 'Giá trị; ô bị ẩn do nhóm < 5 trả object {"suppressed": true}'
        dataAsOf: { type: string, format: date-time }
        stale: { type: boolean }
        suppressedCells: { type: integer }
    Widget:
      type: object
      required: [type, title, querySpec, position]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [KPI, BAR, LINE, PIE, HEATMAP, TABLE] }
        title: { type: string }
        querySpec:
          allOf:
            - $ref: '#/components/schemas/SemanticQuery'
            - type: object
              properties:
                drillPath: { type: array, items: { type: string }, example: [faculty, program, class] }
        position:
          type: object
          properties:
            x: { type: integer }
            y: { type: integer }
            w: { type: integer }
            h: { type: integer }
    DashboardInput:
      type: object
      required: [title, topic]
      properties:
        title: { type: string }
        description: { type: string }
        topic: { $ref: '#/components/schemas/DashboardTopic' }
        globalFilters: { type: array, items: { type: string }, description: Mã dimension làm bộ lọc toàn cục }
        widgets: { type: array, items: { $ref: '#/components/schemas/Widget' } }
    DashboardSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        topic: { $ref: '#/components/schemas/DashboardTopic' }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        owner: { $ref: '#/components/schemas/UserRef' }
        favorite: { type: boolean }
        freshness: { $ref: '#/components/schemas/Freshness' }
    Dashboard:
      allOf:
        - $ref: '#/components/schemas/DashboardSummary'
        - $ref: '#/components/schemas/DashboardInput'
        - type: object
          properties:
            version: { type: integer }
            shares: { type: array, items: { $ref: '#/components/schemas/Share' } }
            canEdit: { type: boolean }
    Share:
      type: object
      required: [principalType, principalId]
      properties:
        principalType: { type: string, enum: [ROLE, ORG_UNIT, USER] }
        principalId: { type: string }
    ExportJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, READY, FAILED] }
        format: { type: string, enum: [PDF, CSV] }
        downloadUrl: { type: string, format: uri, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        watermark: { type: string, example: 'lan.nt@uni.edu.vn · 2026-11-01 09:30' }
        excludedColumns: { type: array, items: { type: string }, description: Cột RESTRICTED bị loại (BR13) }
    MetricInput:
      type: object
      required: [code, name, definition, expression, baseDatasetId]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
        name: { type: string }
        definition: { type: string }
        expression: { type: string, example: 'sum(n_academic_warning) * 1.0 / nullif(sum(n_students), 0)' }
        baseDatasetId: { type: integer, format: int64 }
        allowedDimensions: { type: array, items: { type: string } }
        unit: { type: string, example: '%' }
        glossaryTermId: { type: integer, format: int64, nullable: true }
    Metric:
      allOf:
        - $ref: '#/components/schemas/MetricInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            status: { $ref: '#/components/schemas/MetricStatus' }
            version: { type: integer }
            owner: { $ref: '#/components/schemas/UserRef' }
            certifiedBy: { $ref: '#/components/schemas/UserRef' }
            certifiedAt: { type: string, format: date-time, nullable: true }
    MetricDetail:
      allOf:
        - $ref: '#/components/schemas/Metric'
        - type: object
          properties:
            versions:
              type: array
              items:
                type: object
                properties:
                  version: { type: integer }
                  expression: { type: string }
                  changedBy: { $ref: '#/components/schemas/UserRef' }
                  changedAt: { type: string, format: date-time }
            usedByDashboards: { type: integer }
    Dimension:
      type: object
      properties:
        code: { type: string, example: faculty }
        name: { type: string }
        description: { type: string }

    # ── Reports, alerts, lineage ──
    SubscriptionInput:
      type: object
      required: [dashboardId, cron]
      properties:
        dashboardId: { type: integer, format: int64 }
        cron: { type: string, example: '0 7 * * MON' }
        format: { type: string, enum: [PDF, LINK], default: PDF }
        filters: { $ref: '#/components/schemas/FilterList' }
        includeAiSummary: { type: boolean, default: true }
        recipientIds: { type: array, items: { type: string, format: uuid }, description: Chỉ người dùng nội bộ }
        status: { type: string, enum: [ACTIVE, PAUSED] }
    Subscription:
      allOf:
        - $ref: '#/components/schemas/SubscriptionInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            nextRunAt: { type: string, format: date-time, nullable: true }
            lastDelivery: { $ref: '#/components/schemas/Delivery' }
    Delivery:
      type: object
      properties:
        id: { type: integer, format: int64 }
        recipient: { $ref: '#/components/schemas/UserRef' }
        status: { type: string, enum: [SENT, SKIPPED_NO_ACCESS, FAILED] }
        aiSummary: { type: string, nullable: true }
        artifactUrl: { type: string, format: uri, nullable: true }
        sentAt: { type: string, format: date-time }
    Alert:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: '#/components/schemas/DetectorKind' }
        target:
          type: object
          properties:
            type: { type: string, enum: [DATASET, METRIC] }
            id: { type: string }
            name: { type: string }
        observedValue: { type: number }
        expectedLow: { type: number, nullable: true }
        expectedHigh: { type: number, nullable: true }
        severity: { $ref: '#/components/schemas/AlertSeverity' }
        status: { $ref: '#/components/schemas/AlertStatus' }
        detectedAt: { type: string, format: date-time }
        acknowledgedBy: { $ref: '#/components/schemas/UserRef' }
        note: { type: string, nullable: true }
    AlertDetail:
      allOf:
        - $ref: '#/components/schemas/Alert'
        - type: object
          properties:
            series:
              type: array
              items:
                type: object
                properties:
                  at: { type: string, format: date-time }
                  value: { type: number }
                  low: { type: number, nullable: true }
                  high: { type: number, nullable: true }
                  anomalous: { type: boolean }
            runId: { type: string, format: uuid, nullable: true }
    LineageNode:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/LineageNodeType' }
        refId: { type: string }
        name: { type: string }
        layer: { $ref: '#/components/schemas/DataLayer' }
    LineageGraph:
      type: object
      properties:
        center: { $ref: '#/components/schemas/LineageNode' }
        nodes: { type: array, items: { $ref: '#/components/schemas/LineageNode' } }
        edges:
          type: array
          items:
            type: object
            properties:
              from: { type: integer, format: int64 }
              to: { type: integer, format: int64 }
              transformRef: { type: string, nullable: true }

    # ── Assistant ──
    Conversation:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        dashboardId: { type: integer, format: int64, nullable: true }
        createdAt: { type: string, format: date-time }
    AskRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 2, maxLength: 1000 }
        clarification:
          type: object
          description: Lựa chọn của người dùng cho câu hỏi làm rõ trước đó
          additionalProperties: true
    AssistantMessage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        role: { type: string, enum: [USER, ASSISTANT] }
        content: { type: string }
        status: { $ref: '#/components/schemas/AssistantStatus' }
        aiGenerated: { type: boolean, description: Luôn true với ASSISTANT — FE gắn nhãn "Do AI tạo" (BR20) }
        metricCodes: { type: array, items: { type: string } }
        appliedFilters: { $ref: '#/components/schemas/FilterList' }
        dataAsOf: { type: string, format: date-time, nullable: true }
        result: { $ref: '#/components/schemas/QueryResult' }
        chart:
          type: object
          nullable: true
          properties:
            type: { type: string, enum: [BAR, LINE, PIE, TABLE] }
            x: { type: string }
            y: { type: array, items: { type: string } }
        semanticQuery: { $ref: '#/components/schemas/SemanticQuery' }
        sql: { type: string, nullable: true, description: SQL đã chạy — hiển thị ở nút "Xem truy vấn" }
        refusalReason: { type: string, nullable: true, enum: [OUT_OF_SCOPE, BLOCKED_TOPIC, RESTRICTED_DETAIL, NO_METRIC, null] }
        clarify:
          type: object
          nullable: true
          properties:
            question: { type: string }
            options:
              type: array
              items:
                type: object
                properties:
                  label: { type: string }
                  patch: { type: object, additionalProperties: true }
        feedback: { type: integer, nullable: true, enum: [-1, 1, null] }
        createdAt: { type: string, format: date-time }

    # ── Admin ──
    OrgUnit:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [UNIVERSITY, FACULTY, DEPARTMENT, OFFICE, CENTER] }
        parentCode: { type: string, nullable: true }
    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        orgUnit: { $ref: '#/components/schemas/OrgUnitRef' }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } }
        lastLoginAt: { type: string, format: date-time, nullable: true }
    ColumnRule:
      type: object
      required: [column, action]
      properties:
        column: { type: string }
        action: { type: string, enum: [MASK_PARTIAL, HASH, DENY] }
    PolicyRules:
      type: object
      properties:
        rowFilter: { type: string, nullable: true, example: "faculty_code = current_user_attr('faculty_code')" }
        columnRules: { type: array, items: { $ref: '#/components/schemas/ColumnRule' } }
    Policy:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        datasetId: { type: integer, format: int64 }
        roleCode: { $ref: '#/components/schemas/RoleCode' }
        currentVersion: { $ref: '#/components/schemas/PolicyVersion' }
        active: { type: boolean }
    PolicyVersion:
      allOf:
        - $ref: '#/components/schemas/PolicyRules'
        - type: object
          properties:
            version: { type: integer }
            changeNote: { type: string, nullable: true }
            createdBy: { $ref: '#/components/schemas/UserRef' }
            createdAt: { type: string, format: date-time }
    AuditLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        occurredAt: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/UserRef' }
        action: { type: string }
        objectType: { type: string }
        objectId: { type: string, nullable: true }
        outcome: { type: string, enum: [ALLOW, DENY] }
        ip: { type: string }
        details: { type: object, additionalProperties: true }
    BlockedTopic:
      type: object
      properties:
        id: { type: integer, format: int64 }
        pattern: { type: string }
        description: { type: string, nullable: true }
        createdBy: { $ref: '#/components/schemas/UserRef' }
        createdAt: { type: string, format: date-time }
