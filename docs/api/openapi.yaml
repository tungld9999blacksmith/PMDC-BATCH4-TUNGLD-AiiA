      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DqRuleInput' }
            example:
              datasetId: 12
              columnId: 120
              ruleType: RANGE
              dimension: VALIDITY
              severity: BLOCKING
              params: { min: 0, max: 4 }
              description: GPA tích lũy nằm trong [0, 4]
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DqRule' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /dq/rules/{ruleId}:
