[project]
name = "aiia-backend"
version = "0.1.0"
description = "AiiA Platform API (FastAPI) và worker (Celery)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "psycopg[binary]>=3.2,<4",
    "celery[redis]>=5.4,<6",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.6,<3",
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.20",
    "openpyxl>=3.1,<4",
    "croniter>=5,<7",
    "trino>=0.331,<1",
    "minio>=7.2,<8",
    "redis>=5.2,<7",
    "reportlab>=4.2,<5",
    "email-validator>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
]

[tool.uv]
# Dự án đơn, không cài chính nó thành package: mã nguồn được copy trực tiếp vào image.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
