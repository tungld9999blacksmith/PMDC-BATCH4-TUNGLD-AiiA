# Alembic: control plane schema (database aiia, schema app).
# ASCII only: on Windows Alembic reads this file with the locale encoding.
# DB URL comes from AIIA_DATABASE_URL (see migrations/env.py). Usage: docs/RUNNING.md
#
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "message"
#   uv run alembic check
#   uv run alembic upgrade head --sql > out.sql

[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = UTC
truncate_slug_length = 40
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
