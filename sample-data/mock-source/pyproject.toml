[project]
name = "aiia-mock-source"
version = "0.1.0"
description = "Nguồn dữ liệu giả lập cho AiiA: API + CSDL Postgres (dữ liệu tổng hợp, không dùng dữ liệu thật)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
